<script src="joueurs.js"></script>
<script>
document.getElementById("player-list").innerHTML=PLAYERS.slice().sort(function(a,b){
  return a.name.localeCompare(b.name,"fr",{sensitivity:"base"});
}).map(function(player){
  return '<a class="player-link" href="Joueur.html?joueur='+encodeURIComponent(player.id)+'">'+player.name+'</a>';
}).join("");
var searchInput=document.getElementById("player-search-input");
var searchResults=document.getElementById("player-search-results");
searchInput.addEventListener("input",function(){
  var query=this.value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  var visibleCount=0;
  document.querySelectorAll(".player-link").forEach(function(link){
    var name=link.textContent.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    var matches=!query||name.indexOf(query)!==-1;
    link.hidden=!matches;
    if(matches)visibleCount++;
  });
  searchResults.textContent="";
  if(query){
    var message=document.createElement("p");
    message.className="search-message";
    message.setAttribute("role","status");
    message.textContent=visibleCount
      ?visibleCount+" joueur"+(visibleCount>1?"s":"")+" affiché"+(visibleCount>1?"s":"")+"."
      :"Aucun joueur trouvé.";
    searchResults.appendChild(message);
  }
});
</script>
