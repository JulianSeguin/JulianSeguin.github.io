<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement LoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="Classement.css">
<link rel="stylesheet" href="theme-toggle.css">
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <nav class="pill" aria-label="Navigation principale">
      <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>Roulette</a>
      <a href="Classement.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Classement</a>
      <a href="ClassementStatistique.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 6-7"/></svg>Classement statistique</a>
      <a href="Profils.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M16 4a4 4 0 0 1 0 8m2 3a6 6 0 0 1 4 6"/></svg>Profil</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Mode sombre</button>
  </div>
</header>

<main>
  <form class="player-search" id="player-search-form">
    <div class="search-controls">
      <label for="player-search-input">Nom du joueur à rechercher</label>
      <input id="player-search-input" type="search" placeholder="Rechercher un joueur..." autocomplete="off">
    </div>
    <div id="player-search-results" aria-live="polite"></div>
  </form>
  <section class="card ranking" id="ranking-view">
    <header class="ranking-head">
      <h1>CLASSEMENT</h1>
      <p class="sub">League of Legends</p>
    </header>
    <div class="ranking-table-wrap">
      <table class="ranking-table">
        <thead><tr><th scope="col" aria-label="Rang"></th><th scope="col" aria-label="Joueur"></th><th scope="col">J</th><th scope="col">V</th><th scope="col">D</th><th scope="col">PTS</th></tr></thead>
        <tbody id="ranking-rows"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-brand">
      <span class="footer-mark" aria-hidden="true">SL</span>
      <div>
        <strong>Seguin Julian</strong>
        <p>Classements et outils pour vos parties de League of Legends.</p>
      </div>
    </div>
    <nav class="footer-links" aria-label="Liens de pied de page">
      <a href="index.html">Roulette</a>
      <a href="Classement.html">Classement</a>
      <a href="ClassementStatistique.html">Statistiques</a>
      <a href="Profils.html">Profils</a>
    </nav>
    <div class="footer-bottom">
      <span>© <time class="footer-year"></time> Seguin Julian</span>
      <span>Projet personnel, non affilié à Riot Games.</span>
    </div>
  </div>
</footer>

<script src="joueurs.js"></script>
<script>
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function renderRanking(){
  $("ranking-rows").innerHTML=PLAYERS.map(function(player,index){
    return '<tr><td>'+(index+1)+'</td><td><span class="ranking-name">'+esc(player.name)+'</span></td><td>'+player.games+'</td><td>'+player.wins+'</td><td>'+player.losses+'</td><td>'+player.points+'</td></tr>';
  }).join("");
}
renderRanking();
function filterRankings(query){
  var matches=PLAYERS.filter(function(player){
    var name=player.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    return !query||name.indexOf(query)!==-1;
  });
  document.querySelectorAll("#ranking-rows tr").forEach(function(row){
    var name=row.cells[1].textContent.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    row.hidden=!!query&&name.indexOf(query)===-1;
  });
  var results=$("player-search-results");
  if(!query)return;
  var message=document.createElement("p");
  message.className="search-message";
  message.setAttribute("role","status");
  message.textContent=matches.length
    ?matches.length+" joueur"+(matches.length>1?"s":"")+" affiché"+(matches.length>1?"s":"")+"."
    :"Aucun joueur trouvé.";
  results.appendChild(message);
}
setupPlayerSearch("player-search-form","player-search-input","player-search-results",filterRankings);
</script>
</body>
</html>
