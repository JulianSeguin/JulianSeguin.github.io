<script src="joueurs.js?v=6"></script>
<script src="chart.js?v=4"></script>
<script src="extras.js?v=3"></script>
<script>
var profile=document.getElementById("profile");
profile.innerHTML='<p class="data-source">Chargement du profil…</p>';
function esc(value){return escHtml(value)}
loadTournament().then(function(){
var playerId=new URLSearchParams(location.search).get("joueur");
var player=PLAYERS.find(function(entry){return entry.id===playerId});
if(!player){
  profile.innerHTML='<p class="error">Profil introuvable. Choisis un joueur dans le classement.</p><a class="profile-back" href="Classement.html">← Retour au classement</a>';
  return;
}
var rank=player.rank;
function rankLabel(field){var r=statRank(field,player.id);return r?"#"+r+" au classement":"Classé dès "+MIN_GAMES_STATS+" parties"}
var winRate=fmt(player.winRate*100,1);
document.title="Profil de "+player.name+" – League of Legends";

// Historique (plus récente en premier)
var byNum={};
MATCHES.forEach(function(m){byNum[m.num]=m});
var rows=player.history.slice().reverse().map(function(g){
  var m=byNum[g.game],mates=(g.team==="A"?m.A:m.B).filter(function(r){return r.id!==player.id}).map(function(r){return esc(r.name)}).join(", ");
  return '<tr class="'+(g.win?'is-win':'is-loss')+'">'+
    '<td><a href="Parties.html#partie-'+g.game+'">Partie '+g.game+'</a></td>'+
    '<td><span class="result-pill">'+(g.win?'Victoire':'Défaite')+'</span>'+(g.isMvp?' <span class="mvp-tag" title="Meilleur KDA de la partie">MVP</span>':'')+'</td>'+
    '<td class="kda-line"><b>'+g.kills+'</b> / <b class="d">'+g.deaths+'</b> / <b>'+g.assists+'</b></td>'+
    '<td class="num">'+fmt(g.kda)+'</td>'+
    '<td class="mates">'+mates+'</td></tr>';
}).join("");
var form=player.history.slice(-5).map(function(g){return '<span class="form-dot '+(g.win?'w':'l')+'" title="Partie '+g.game+' : '+(g.win?'victoire':'défaite')+'">'+(g.win?'V':'D')+'</span>'}).join("");
var bg=player.bestGame;
var mvpGames=player.history.filter(function(g){return g.isMvp}).map(function(g){return g.game});
var mvpDetail=mvpGames.length?(mvpGames.length>1?'Parties ':'Partie ')+mvpGames.join(', '):'Pas encore MVP';
var badges=computeBadges()[player.id]||[],pace=playerPace(player);
var streakLabel=player.streak.count+' '+(player.streak.type==="V"?'victoire':'défaite')+(player.streak.count>1?'s':'');

profile.innerHTML=
  '<a class="profile-back" href="Profils.html">← Retour aux profils</a>'+
  '<header class="profile-top"><div class="profile-rank'+(rank>3?' is-other':'')+'" data-rank="'+rank+'">#'+rank+'</div><div><p class="eyebrow">Profil joueur</p><h1>'+esc(player.name)+'</h1>'+(player.pseudo?'<p class="pseudo">'+esc(player.pseudo)+'</p>':'')+'</div></header>'+
  (badges.length?'<ul class="badges" aria-label="Badges">'+badges.map(function(b){return '<li class="badge" title="'+b.desc+'"><span aria-hidden="true">'+b.icon+'</span>'+b.name+'<small>'+b.desc+'</small></li>'}).join("")+'</ul>':'')+
  '<h2 class="profile-section-title">Résultats</h2>'+
  '<div class="profile-stats profile-summary">'+
  '<div class="profile-stat is-pts"><strong>'+player.points+'</strong><span>Points</span></div>'+
  '<div class="profile-stat"><strong>'+player.games+'</strong><span>Parties</span></div>'+
  '<div class="profile-stat is-win"><strong>'+player.wins+'</strong><span>Victoires</span></div>'+
  '<div class="profile-stat is-loss"><strong>'+player.losses+'</strong><span>Défaites</span></div>'+
  '<div class="profile-stat"><strong>'+winRate+' %</strong><span>Winrate</span></div>'+
  '</div><h2 class="profile-section-title">Combat</h2><div class="profile-stats profile-combat">'+
  '<div class="profile-stat"><strong>'+player.kills+'</strong><span>Kills</span><small>'+rankLabel("kills")+'</small></div>'+
  '<div class="profile-stat"><strong>'+player.deaths+'</strong><span>Morts</span><small>'+rankLabel("deaths")+'</small></div>'+
  '<div class="profile-stat"><strong>'+player.assists+'</strong><span>Assists</span><small>'+rankLabel("assists")+'</small></div>'+
  '<div class="profile-stat"><strong>'+fmt(player.kda)+'</strong><span>KDA</span><small>'+rankLabel("kda")+'</small></div>'+
  '</div>'+
  '<h2 class="profile-section-title">Rythme</h2><div class="profile-stats profile-pace">'+
  (pace?
    '<div class="profile-stat"><strong>'+fmt(pace.avg,0)+'<small class="unit"> min</small></strong><span>Durée moyenne</span></div>'+
    '<div class="profile-stat"><strong>'+fmt(pace.kpm)+'</strong><span>Kills / min</span></div>'+
    '<div class="profile-stat"><strong>'+fmt(pace.apm)+'</strong><span>Assists / min</span></div>'+
    '<div class="profile-stat"><strong>'+fmt(pace.dpm)+'</strong><span>Morts / min</span></div>'+
    (pace.games<player.games?'<p class="pace-note">Calculé sur '+pace.games+' partie'+(pace.games>1?'s':'')+' sur '+player.games+' (durée non saisie pour les autres).</p>':'')
  :'<p class="pace-note">Disponible dès que la durée des parties est saisie dans le Sheet.</p>')+
  '</div>'+
  '<h2 class="profile-section-title">Forme</h2><div class="profile-highlights">'+
  '<div class="hl is-mvp" title="MVP : joueur de l’équipe gagnante avec le meilleur KDA de la partie"><span class="hl-label">MVP</span><strong>'+mvpGames.length+'<small class="unit"> fois</small></strong><small>'+mvpDetail+'</small></div>'+
  '<div class="hl"><span class="hl-label">5 dernières parties</span><div class="form-row">'+form+'</div></div>'+
  '<div class="hl"><span class="hl-label">Série en cours</span><strong class="'+(player.streak.type==="V"?'c-win':'c-loss')+'">'+streakLabel+'</strong></div>'+
  '<div class="hl"><span class="hl-label">Record de victoires d’affilée</span><strong>'+player.bestWinStreak+'</strong></div>'+
  (bg?'<div class="hl"><span class="hl-label">Meilleure partie</span><strong>'+bg.kills+' / '+bg.deaths+' / '+bg.assists+'</strong><small>Partie '+bg.game+' · KDA '+fmt(bg.kda)+'</small></div>':'')+
  '</div>'+
  '<section class="chart-card" aria-labelledby="chart-title"><div class="chart-head"><h2 id="chart-title">Évolution des points</h2>'+
  '<p>Points cumulés de '+esc(player.name)+' après chaque partie. Ajoute jusqu’à 4 joueurs pour comparer.</p></div><div id="points-chart"></div></section>'+
  '<section class="chart-card" aria-labelledby="duel-title"><div class="chart-head"><h2 id="duel-title">Face-à-face</h2>'+
  '<p>Compare '+esc(player.name)+' à un autre joueur. Le meilleur des deux est marqué en or.</p></div><div id="duel"></div></section>'+
  '<h2 class="profile-section-title">Historique des parties</h2>'+
  '<div class="history-wrap"><table class="history"><thead><tr><th scope="col">Partie</th><th scope="col">Résultat</th><th scope="col">K / D / A</th><th scope="col" class="num">KDA</th><th scope="col" class="mates">Coéquipiers</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<p class="data-source"></p>';
renderPointsChart("points-chart",[player.id],[player.id]);
renderDuel("duel",player.id);
showDataSource();
});
</script>
</body>
</html>
