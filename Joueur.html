<script src="joueurs.js"></script>
<script>
var playerId=new URLSearchParams(location.search).get("joueur");
var player=PLAYERS.find(function(entry){return entry.id===playerId});
var profile=document.getElementById("profile");
function esc(value){return String(value).replace(/[&<>"']/g,function(char){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]})}
if(!player){
  profile.innerHTML='<p class="error">Profil introuvable. Choisis un joueur dans le classement.</p><a class="profile-back" href="Classement.html">← Retour au classement</a>';
}else{
  var rank=PLAYERS.findIndex(function(entry){return entry.id===player.id})+1;
  var winRate=(player.wins/player.games*100).toFixed(1);
  var killsRank=KILL_ORDER.indexOf(player.id)+1;
  var deathsRank=DEATH_ORDER.indexOf(player.id)+1;
  var assistsRank=ASSIST_ORDER.indexOf(player.id)+1;
  var kda=((player.kills+player.assists)/player.deaths).toFixed(2);
  document.title="Profil de "+player.name+" – League of Legends";
  profile.innerHTML=
    '<header class="profile-top"><div class="profile-rank">#'+rank+'</div><div><h1>'+esc(player.name)+'</h1><p>Profil joueur · League of Legends</p></div></header>'+
    '<h2 class="profile-section-title">Classement statistiques</h2>'+
    '<div class="profile-stats profile-summary">'+
    '<div class="profile-stat"><strong>'+player.games+'</strong><span>Parties jouées</span></div>'+
    '<div class="profile-stat"><strong>'+player.wins+'</strong><span>Victoires</span></div>'+
    '<div class="profile-stat"><strong>'+player.losses+'</strong><span>Défaites</span></div>'+
    '<div class="profile-stat"><strong>'+winRate+' %</strong><span>Taux de victoire</span></div>'+
    '<div class="profile-stat"><strong>'+player.points+'</strong><span>Points</span></div>'+
    '</div><div class="profile-stats profile-combat">'+
    '<div class="profile-stat"><strong>'+player.kills+'</strong><span>Kills</span><small>#'+killsRank+' au classement</small></div>'+
    '<div class="profile-stat"><strong>'+player.deaths+'</strong><span>Morts</span><small>#'+deathsRank+' au classement</small></div>'+
    '<div class="profile-stat"><strong>'+player.assists+'</strong><span>Assists</span><small>#'+assistsRank+' au classement</small></div>'+
    '<div class="profile-stat"><strong>'+kda+'</strong><span>KDA</span><small>(Kills + Assists) / Morts</small></div>'+
    '</div><a class="profile-back" href="Profils.html">← Retour aux profils</a>';
}
</script>
</body>
</html>
